name: Release

# Publishes all three packages when a version tag is pushed: `git tag v0.1.0 &&
# git push origin v0.1.0`. The tag must match the version in every manifest and
# a dated CHANGELOG heading. The full CI runs first.
#
# Credentials: none are stored in the repository. Each registry trusts this
# workflow by OIDC (trusted publishing), configured once on the registry side
# for the repository datanestllc/tracefast-sdk, workflow release.yml and
# environment `release`. crates.io and npm can only trust a package that
# exists, so the very first version of each is published with a token stored
# as a secret of the `release` environment (CARGO_REGISTRY_TOKEN, NPM_TOKEN);
# delete the token once trusted publishing is configured. See RELEASING.md.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    name: Tag matches every manifest and the changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          ts=$(node -p "require('./typescript/package.json').version")
          tsv=$(sed -nE "s/^export const VERSION = '([^']+)'.*/\1/p" typescript/src/version.ts)
          py=$(sed -nE 's/^VERSION = "([^"]+)".*/\1/p' python/src/tracefast/_version.py)
          rs=$(sed -nE 's/^version = "([^"]+)".*/\1/p' rust/Cargo.toml | head -1)
          echo "tag $v · npm $ts ($tsv) · PyPI $py · crates.io $rs"
          for x in "$ts" "$tsv" "$py" "$rs"; do
            [ "$x" = "$v" ] || { echo "::error::version $x does not match the tag v$v"; exit 1; }
          done
          grep -qE "^## $v — [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no dated heading '## $v — YYYY-MM-DD'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  crates:
    name: crates.io
    needs: [ci, version]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable
      # Trusted publishing, unless a first-release token is stored. The token
      # is only in the env of the steps that need it.
      - id: token
        env:
          FIRST_RELEASE_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: echo "stored=$([ -n "$FIRST_RELEASE_TOKEN" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - id: oidc
        if: steps.token.outputs.stored == 'no'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.oidc.outputs.token }}

  pypi:
    name: PyPI
    needs: [ci, version]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.13'
      - run: uv build
        working-directory: python
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: python/dist/

  npm:
    name: npm
    needs: [ci, version]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      # prepack builds dist/; publishConfig sets public access and provenance.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
