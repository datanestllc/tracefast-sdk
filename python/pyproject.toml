[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tracefast"
dynamic = ["version"]
description = "The official Python SDK for the TraceFast API — Ethereum blocks, transactions, traces, tokens, contracts, DEX pools, the consensus layer, and what TraceFast states about an address."
license = "MIT"
readme = "README.md"
authors = [{ name = "TraceFast" }]
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "typing-extensions>=4.7",
]
keywords = ["tracefast", "ethereum", "evm", "blockchain", "web3", "sdk", "api", "api-client", "onchain", "blockchain-analytics", "transaction-trace", "smart-contracts", "defi", "dex", "forensics", "compliance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
  "Private :: Do Not Upload",
]

[project.urls]
Homepage = "https://tracefast.xyz"
Documentation = "https://docs.tracefast.xyz/api"
Blog = "https://blog.tracefast.xyz"
Repository = "https://github.com/datanestllc/tracefast-sdk"
Issues = "https://github.com/datanestllc/tracefast-sdk/issues"
Changelog = "https://github.com/datanestllc/tracefast-sdk/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.hatch.version]
path = "src/tracefast/_version.py"
pattern = "VERSION = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["src/tracefast"]

[tool.hatch.build.targets.sdist]
include = ["src/tracefast", "pyproject.toml", "README.md", "LICENSE"]
exclude = ["tests", "examples"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "examples", "tests/static"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error::RuntimeWarning"
