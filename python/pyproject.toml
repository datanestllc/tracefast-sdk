[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tracefast"
dynamic = ["version"]
description = "The official Python SDK for the TraceFast API — Ethereum blocks, transactions, traces, tokens, contracts and what TraceFast proves about an address."
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "typing-extensions>=4.7",
]
keywords = ["tracefast", "ethereum", "api", "sdk", "blockchain", "traces", "evm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
  "Private :: Do Not Upload",
]

[project.urls]
Homepage = "https://docs.tracefast.xyz/api"
Documentation = "https://docs.tracefast.xyz/api"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.hatch.version]
path = "src/tracefast/_version.py"
pattern = "VERSION = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["src/tracefast"]

[tool.hatch.build.targets.sdist]
include = ["src/tracefast", "tests", "pyproject.toml"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error::RuntimeWarning"
