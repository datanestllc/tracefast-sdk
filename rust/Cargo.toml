[package]
name = "tracefast"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "The official Rust SDK for the TraceFast API: Ethereum blocks, transactions, traces, tokens, contracts and what TraceFast states about an address."
homepage = "https://docs.tracefast.xyz/api"
documentation = "https://docs.tracefast.xyz/api"
keywords = ["tracefast", "ethereum", "api", "sdk", "evm"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]
publish = false
readme = "README.md"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
